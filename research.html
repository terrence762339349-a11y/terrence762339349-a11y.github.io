<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Research | Yinjie He</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --main-blue: #0b4f9c;
}

body {
  margin: 0;
  font-family: "Georgia", "Times New Roman", serif;
  color: #222;
}

/* ===== Navigation ===== */
nav {
  background-color: var(--main-blue);
  padding: 14px 0;
  text-align: center;
}

nav a {
  color: #ffffff;
  text-decoration: none;
  margin: 0 16px;
  font-size: 15px;
}

nav a:hover {
  text-decoration: underline;
}

/* ===== Hero Section ===== */
.hero {
  height: 100vh;
  background: url("assets/images/research/research-hero.jpg") center center / cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
}

.hero-content {
  position: relative;
  color: #fff;
  z-index: 1;
}

.hero h1 {
  font-size: 48px;
  font-weight: normal;
  letter-spacing: 1px;
  margin-bottom: 30px;
}

.scroll-btn {
  display: inline-block;
  border: 1.5px solid #fff;
  padding: 10px 28px;
  font-size: 14px;
  letter-spacing: 1px;
  color: #fff;
  cursor: pointer;
}

.scroll-btn:hover {
  background: rgba(255,255,255,0.15);
}

/* ===== Research Themes ===== */
.section {
  max-width: 1100px;
  margin: 100px auto;
  padding: 0 20px;
}

.section h2 {
  font-size: 32px;
  font-weight: normal;
  margin-bottom: 50px;
  text-align: center;
}

.themes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 60px;
}

.theme {
  text-align: center;
}

.theme img {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}

.theme h3 {
  font-size: 20px;
  font-weight: normal;
  margin-top: 18px;
  color: var(--main-blue);
}

/* ===== Mobile ===== */
@media (max-width: 768px) {
  .hero h1 {
    font-size: 34px;
  }

  .themes {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- ===== Navigation ===== -->
<nav>
  <a href="index.html">Home</a>
  <a href="news/">News</a>
  <a href="research.html">Research</a>
  <a href="publications.html">Publications</a>
  <a href="cv.html">CV</a>
</nav>

<!-- ===== Hero ===== -->
<section class="hero">
  <div class="hero-content">
    <h1>Research Overview</h1>
    <div class="scroll-btn" onclick="document.getElementById('themes').scrollIntoView({behavior:'smooth'})">
      Explore Research
    </div>
  </div>
</section>

<!-- ===== Research Themes ===== -->
<section class="section" id="themes">
  <h2>Research Themes</h2>

  <div class="themes">
    <div class="theme">
      <img src="assets/images/research/theme-spatiotemporal.jpg" alt="">
      <h3>Spatiotemporal Data Analytics</h3>
    </div>

    <div class="theme">
      <img src="assets/images/research/theme-gis-remote-sensing.jpg" alt="">
      <h3>GIS and Remote Sensing</h3>
    </div>

    <div class="theme">
      <img src="assets/images/research/theme-land-transport.jpg" alt="">
      <h3>Land–Transportation Interaction</h3>
    </div>

    <div class="theme">
      <img src="assets/images/research/theme-urban-sustainability.jpg" alt="">
      <h3>Urban Sustainability & Low-Carbon Development</h3>
    </div>
  </div>
</section>

</body>
</html>
