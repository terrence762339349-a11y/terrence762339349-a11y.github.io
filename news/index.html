<style>
:root {
  --main-blue: #0b4f9c;
  --border-color: #e5e5e5;
  --text-color: #222;
  --subtext-color: #555;
}

body {
  font-family: "Georgia", "Times New Roman", serif;
  margin: 0;
  background: #fff;
  color: var(--text-color);
}

/* ===== Navigation ===== */
nav {
  background-color: var(--main-blue);
  padding: 14px 0;
  text-align: center;
}

nav a {
  color: #fff;
  margin: 0 16px;
  text-decoration: none;
  font-size: 15px;
}

.nav-current {
  font-weight: 700;
  text-decoration: underline;
}

/* ===== Container ===== */
.container {
  max-width: 880px;
  margin: 60px auto;
  padding: 0 20px;
}

h1 {
  font-size: 32px;
  font-weight: normal;
  margin-bottom: 30px;
}

/* ===== News Item ===== */
.news-item {
  display: flex;
  gap: 24px;
  padding: 24px 0;
  border-bottom: 1px solid var(--border-color);
}

.news-item img {
  width: 160px;
  height: auto;
}

.news-content {
  flex: 1;
}

.news-title {
  font-size: 18px;
  margin-bottom: 8px;
}

.news-title a {
  color: var(--main-blue);
  text-decoration: none;
  border-bottom: 1px solid #f1c40f;
  padding-bottom: 2px;
}

.news-title a:hover {
  opacity: 0.85;
}

.news-date {
  font-size: 14px;
  color: #888;
  margin-bottom: 6px;
}

.news-summary {
  font-size: 16px;
  color: var(--subtext-color);
  line-height: 1.6;
}

/* ===== Mobile ===== */
@media (max-width: 700px) {
  .news-item {
    flex-direction: column;
  }

  .news-item img {
    width: 100%;
    max-width: 360px;
  }
}
</style>
</head>
